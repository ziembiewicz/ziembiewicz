# Guards the public profile against the two mistakes that are cheap to make
# and expensive to notice late: leaking a non-brand identity, and shipping
# an unfinished placeholder.
name: profile-guard

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the profile
        # pinned to the v7.0.1 commit, not a moving tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: No foreign identity in the published profile
        run: |
          if grep -rniE 'kaizenforge|ziembiewicz\.pl' README.md; then
            echo "::error::README carries an identity that does not belong to the brand."
            exit 1
          fi
          echo "Identity clean."

      - name: No unfinished placeholders
        run: |
          if grep -rniE 'pending|TBD|TODO|\[blog URL' README.md; then
            echo "::error::README still contains a placeholder."
            exit 1
          fi
          echo "No placeholders."
